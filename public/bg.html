<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CGM Trendicator</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-width: 100vw;
      }

      #trendicator-container {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>

  <body>
    <div id="trendicator-container"></div>

    <script type="module">
      import { getCGMTrendicator } from '/circle-trendicator.js';

      // make sure the trendicator fits since Alexa has a variety of screen sizes
      function getCircleSize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        return Math.floor(Math.min(w, h) * 0.5);
      }

      // debounce function to limit how often renderTrendicator is called on resize
      function debounce(fn, delay) {
        let timer = null;
        return function (...args) {
          clearTimeout(timer);
          timer = setTimeout(() => fn.apply(this, args), delay);
        };
      }

      let cachedGlucoseData = null;

      function renderTrendicator() {
        const trendicatorContainer = document.getElementById(
          'trendicator-container',
        );
        if (!cachedGlucoseData) return;
        const circleSize = getCircleSize();
        const props = {
          size: circleSize,
          'hours-of-history': 8,
        };
        const trendicator = getCGMTrendicator(cachedGlucoseData, props);
        trendicatorContainer.innerHTML = trendicator;
      }

      async function fetchGlucose() {
        try {
          const trendicatorContainer = document.getElementById(
            'trendicator-container',
          );
          const response = await fetch('/glucose');
          cachedGlucoseData = await response.json();
          renderTrendicator();
        } catch (error) {
          trendicatorContainer.innerHTML = `<p style="color: #ffaaaa;">Error: ${error.message}</p>`;
        }
      }

      window.addEventListener('resize', debounce(renderTrendicator, 300));
      window.addEventListener('DOMContentLoaded', fetchGlucose);
    </script>

    <script>
      function checkQuerystring() {
        const getColorCSS = (c) => {
          let ele = document.createElement("div");
          ele.style.color = c;
          return ele.style.color.split(/\s+/).join('').toLowerCase();
        }
        
        const isColorValid = (c) => {
          let s = getColorCSS(c);
          return (s) ? true : false;
        }
        
        const urlParams = new URLSearchParams(window.location.search);
        const bgColor = urlParams.get('bg');
        
        if (bgColor) {
          function addHashIfMissing(str) {
            // Regular expression for valid 3, 4, 6, or 8 character hex codes
            const hexRegex = /^([0-9a-fA-F]{3}|[0-9a-fA-F]{4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})\$/;
            
            // If it's a valid hex string without a hash, prepend the hash
            if (hexRegex.test(str)) {
              return `#${str}`;
            }
            
            return str;
          }

          const c = addHashIfMissing(bgColor);
          const pageBackgroundColor = getColorCSS(c);
          
          if (isColorValid(pageBackgroundColor)) {
            document.body.style.backgroundColor = pageBackgroundColor;
          } else {
            document.body.style.backgroundColor = "#000000";
          }
        }
      }

      window.addEventListener('DOMContentLoaded', checkQuerystring);
    </script>
  </body>
</html>
